<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Instant Wordbook 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <h1>Instant Wordbook 设置</h1>
      <form id="options-form">
        <label for="server-url">本地服务地址</label>
        <div class="field-row">
          <input id="server-url" name="serverUrl" type="url" value="http://127.0.0.1:8787" />
          <button type="submit">保存</button>
          <button type="button" id="test-server">测试</button>
        </div>
        <label for="sentence-model">GPT 句子分析模型</label>
        <div class="field-row model-row">
          <select id="sentence-model" name="sentenceModel">
            <option value="">使用本地服务默认模型</option>
          </select>
          <button type="button" id="refresh-models">刷新模型</button>
        </div>
      </form>
      <p id="status"></p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
